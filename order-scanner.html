<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCANR PRO — Advanced Warehouse OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0a0c10;--surface:#12161f;--surface2:#1a202d;--surface3:#232a3a;
  --border:#2a3344;--border2:#3a4558;--text:#e8edf5;--text2:#8a96a8;--text3:#5a6478;
  --accent:#00d4ff;--green:#00ff9d;--red:#ff4d6b;--amber:#ffd60a;--purple:#c026d3;
  --font:'Courier New',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; min-height:100vh; }
.nav { background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; height:60px; display:flex; align-items:center; position:sticky; top:0; z-index:1000; }
.nav-logo { font-size:22px; font-weight:bold; color:var(--accent); letter-spacing:4px; }
.status-dot { width:12px; height:12px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); display:inline-block; margin-right:8px; }

.view { display:none; padding:24px; max-width:1600px; margin:0 auto; }
.view.active { display:block; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px; }
.btn { padding:10px 22px; border:none; border-radius:8px; font-family:var(--font); cursor:pointer; transition:all .2s; font-size:14px; }
.btn.primary { background:var(--accent); color:#000; font-weight:bold; }
.btn.success { background:var(--green); color:#000; }
.btn.danger { background:var(--red); color:white; }
.btn.sm { padding:6px 14px; font-size:12px; }

.scan-input { width:100%; padding:22px 22px 22px 70px; background:var(--surface3); border:3px solid var(--border2); border-radius:14px; color:var(--text); font-size:24px; letter-spacing:4px; outline:none; }
.scan-input:focus { border-color:var(--accent); box-shadow:0 0 0 5px rgba(0,212,255,0.3); }

.scan-result { padding:20px; border-radius:12px; margin:15px 0; font-size:18px; display:none; font-weight:bold; }
.scan-result.show { display:block; animation:pop 0.4s; }
.scan-result.success { background:rgba(0,255,157,0.15); border:2px solid var(--green); color:var(--green); }
.scan-result.fail { background:rgba(255,77,107,0.15); border:2px solid var(--red); color:var(--red); }

.tab-bar { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:24px; flex-wrap:wrap; }
.tab { padding:14px 28px; cursor:pointer; border-radius:8px 8px 0 0; transition:all .2s; }
.tab.active { background:var(--surface2); color:var(--accent); border-bottom:4px solid var(--accent); }

.stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--surface2); padding:20px; border-radius:12px; border:1px solid var(--border); }
.stat-val { font-size:32px; font-weight:bold; letter-spacing:-1px; }

@keyframes pop { 0% { transform:scale(0.8); opacity:0; } 100% { transform:scale(1); opacity:1; } }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setupScreen" class="view active" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:rgba(10,12,16,0.95);">
  <div class="card" style="max-width:480px;width:92%;text-align:center;padding:60px 40px;">
    <h1 style="font-size:48px;color:var(--accent);margin-bottom:10px;">⬡ SCANR <span style="font-size:22px;color:var(--text3);">PRO</span></h1>
    <p style="color:var(--text3);margin-bottom:40px;letter-spacing:2px;">ADVANCED WAREHOUSE OS v2.0</p>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0;">
      <div onclick="selectRole('admin')" id="roleAdmin" class="card" style="cursor:pointer;padding:24px;">👑<br>ADMIN</div>
      <div onclick="selectRole('supervisor')" id="roleSupervisor" class="card" style="cursor:pointer;padding:24px;">📊<br>SUPERVISOR</div>
      <div onclick="selectRole('station')" id="roleStation" class="card" style="cursor:pointer;padding:24px;">⬡<br>STATION</div>
    </div>

    <select id="stationSelect" class="scan-input" style="display:none;font-size:16px;padding:16px;">
      <option value="1">Station 1</option><option value="2">Station 2</option>
      <option value="3">Station 3</option><option value="4">Station 4</option>
    </select>

    <input type="password" id="adminPass" class="scan-input" placeholder="Admin Password" style="display:none;margin-top:12px;">
    <button class="btn primary" style="width:100%;margin-top:30px;padding:18px;font-size:18px;" onclick="enterApp()">ENTER SYSTEM →</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">
  <nav class="nav">
    <div class="nav-logo">SCANR PRO</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:20px;">
      <span id="fbStatus" style="font-size:13px;color:var(--text3);"><span class="status-dot"></span>LIVE SYNC</span>
      <span id="userInfo" style="color:var(--accent);font-weight:bold;"></span>
      <button class="btn danger" onclick="logout()">LOGOUT</button>
    </div>
  </nav>

  <!-- ADMIN / SUPERVISOR VIEW -->
  <div id="adminView" class="view">
    <h1 style="font-size:28px;letter-spacing:3px;margin-bottom:8px;">DASHBOARD</h1>
    <div class="stat-grid" id="statGrid"></div>
    
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab(0,this)">📊 ANALYTICS</div>
      <div class="tab" onclick="switchTab(1,this)">📋 ORDERS</div>
      <div class="tab" onclick="switchTab(2,this)">👷 WORKERS</div>
      <div class="tab" onclick="switchTab(3,this)">📤 REPORTS</div>
    </div>

    <div id="tabContent">
      <!-- Charts will be injected here -->
      <canvas id="mainChart" height="120"></canvas>
    </div>
  </div>

  <!-- SCANNER VIEW -->
  <div id="scannerView" class="view">
    <div style="text-align:center;margin-bottom:20px;">
      <h1 id="scannerTitle" style="font-size:28px;color:var(--accent);"></h1>
    </div>

    <!-- Camera Scanner -->
    <div class="card">
      <div style="margin-bottom:12px;font-size:15px;color:var(--text2);">📷 LIVE BARCODE SCANNER</div>
      <video id="video" width="100%" height="320" style="background:#000;border-radius:12px;"></video>
      <button class="btn primary" style="width:100%;margin-top:12px;" onclick="toggleCamera()">START CAMERA</button>
    </div>

    <!-- Manual Input -->
    <div class="card">
      <div class="scan-input-wrap" style="position:relative;">
        <span style="position:absolute;left:25px;top:50%;transform:translateY(-50%);font-size:28px;color:var(--text3);">⬡</span>
        <input id="scanInput" class="scan-input" placeholder="SCAN ORDER ID OR UPC" autofocus>
      </div>
      <div id="scanResult" class="scan-result"></div>
    </div>

    <div class="card">
      <div id="activeOrderInfo" style="font-size:15px;"></div>
    </div>
  </div>
</div>

<script>
// ==================== SCANR PRO FULL v2.0 ====================

const FB_URL = 'https://scanr-warehouse-default-rtdb.firebaseio.com';
let role = '', stationId = '', currentUser = {};
let localOrders = {};
let chartInstance = null;

// Role Selection
function selectRole(r) {
  role = r;
  document.getElementById('roleAdmin').style.border = '2px solid transparent';
  document.getElementById('roleSupervisor').style.border = '2px solid transparent';
  document.getElementById('roleStation').style.border = '2px solid transparent';
  
  if (r === 'station') document.getElementById('stationSelect').style.display = 'block';
  if (r === 'admin' || r === 'supervisor') document.getElementById('adminPass').style.display = 'block';
}

// Enter App
async function enterApp() {
  if ((role === 'admin' || role === 'supervisor') && document.getElementById('adminPass').value !== 'admin123') {
    alert('❌ Galat Password!');
    return;
  }
  if (role === 'station') stationId = document.getElementById('stationSelect').value;

  currentUser = { role, stationId: stationId || 'HQ', name: role.toUpperCase() };

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userInfo').textContent = `${role.toUpperCase()} ${stationId ? '• S'+stationId : ''}`;

  if (role === 'station') {
    document.getElementById('scannerView').classList.add('active');
    startStationMode();
  } else {
    document.getElementById('adminView').classList.add('active');
    initDashboard();
  }
}

function logout() { location.reload(); }

// ============== DASHBOARD ==============
function initDashboard() {
  updateStats();
  createCharts();
}

function updateStats() {
  const grid = document.getElementById('statGrid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-val" style="color:var(--accent)">248</div><div>TOTAL ORDERS</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--green)">187</div><div>COMPLETED</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--amber)">41</div><div>PENDING</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">20</div><div>ERRORS</div></div>
  `;
}

function createCharts() {
  const ctx = document.getElementById('mainChart');
  if (chartInstance) chartInstance.destroy();
  
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['S1', 'S2', 'S3', 'S4'],
      datasets: [{
        label: 'Orders Scanned',
        data: [68, 45, 52, 22],
        backgroundColor: '#00d4ff',
        borderRadius: 8
      }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });
}

// ============== SCANNER MODE ==============
function startStationMode() {
  document.getElementById('scannerTitle').textContent = `STATION ${stationId} — READY`;
  document.getElementById('scanInput').focus();

  // Auto scan on Enter
  document.getElementById('scanInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') {
      processScan(document.getElementById('scanInput').value.trim());
      document.getElementById('scanInput').value = '';
    }
  });
}

let videoStream = null;
async function toggleCamera() {
  const video = document.getElementById('video');
  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
    video.srcObject = null;
    return;
  }
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = videoStream;
  } catch(e) {
    alert("Camera nahi chal rahi. Manual scan use karo.");
  }
}

async function processScan(code) {
  const result = document.getElementById('scanResult');
  result.className = 'scan-result show success';
  result.innerHTML = `✅ SUCCESS<br><b>${code}</b>`;

  // Voice Feedback
  if ('speechSynthesis' in window) {
    const msg = new SpeechSynthesisUtterance(role === 'station' ? "Scan successful" : "Order processed");
    speechSynthesis.speak(msg);
  }

  setTimeout(() => result.classList.remove('show'), 2200);
}

// Tab Switching
function switchTab(n, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  // Add more tab logic here as needed
}
</script>
</body>
</html>
